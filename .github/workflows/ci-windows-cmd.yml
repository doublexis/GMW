name: CI (Windows / cmd)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (cmd)
        run: npm ci
        shell: cmd

      - name: Build (cmd)
        run: npm run build
        shell: cmd

      - name: Lint (cmd)
        run: npm run lint
        shell: cmd
